<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miko Part-time (Demo-version)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 640px;
            height: 360px;
            background-color: #000000;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 2px solid #29292e;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Include Phaser 3 from CDN -->
    <script src="phaser3.js"></script>
    
    <!-- Main game script entry -->
    <script src="src/main.js" type="module"></script>
</body>
</html>
